name: CI

on:
  push:
  pull_request:

concurrency:
  group: monodoo-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_repository_contract -v
      - run: python -m unittest tests.test_theme_tokens -v
      - run: python -m unittest tests.test_navigation_models -v
      - run: python -m unittest tests.test_home_navigation_contract -v
      - run: python -m unittest tests.test_appsbar_contract -v
      - run: python -m unittest tests.test_backend_polish_contract -v
      - run: node --experimental-default-type=module --test tests/test_theme_runtime.mjs
      - run: node --experimental-default-type=module --test tests/test_navigation_state.mjs

  odoo-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: chmod +x tests/runtime/prepare_database.sh tests/runtime/wait_http.py
      - run: tests/runtime/prepare_database.sh
      - name: E2E Home release gate
        run: pytest tests/e2e/test_home.py -vv -s --maxfail=1
      - name: Mobile diagnostic - neutral Home
        id: mobile_home
        continue-on-error: true
        run: pytest tests/e2e/test_mobile_diagnostic.py::test_mobile_neutral_home_is_visible -vv -s
      - name: Mobile diagnostic - Project card
        id: mobile_project_card
        continue-on-error: true
        run: pytest tests/e2e/test_mobile_diagnostic.py::test_mobile_project_card_is_visible -vv -s
      - name: Mobile diagnostic - menu toggle
        id: mobile_toggle
        continue-on-error: true
        run: pytest tests/e2e/test_mobile_diagnostic.py::test_mobile_project_exposes_standard_menu_toggle -vv -s
      - name: Mobile diagnostic - sidebar topbar
        id: mobile_topbar
        continue-on-error: true
        run: pytest tests/e2e/test_mobile_diagnostic.py::test_mobile_menu_toggle_exposes_sidebar_topbar -vv -s
      - name: Mobile diagnostic - Home app entry
        id: mobile_home_entry
        continue-on-error: true
        run: pytest tests/e2e/test_mobile_diagnostic.py::test_mobile_sidebar_topbar_exposes_home_app -vv -s
      - name: Mobile diagnostic - return Home
        id: mobile_return_home
        continue-on-error: true
        run: pytest tests/e2e/test_mobile_diagnostic.py::test_mobile_home_app_returns_to_monodoo_home -vv -s
      - name: Enforce mobile Home result
        if: always()
        run: test "${{ steps.mobile_home.outcome }}" = success
      - name: Enforce mobile Project card result
        if: always()
        run: test "${{ steps.mobile_project_card.outcome }}" = success
      - name: Enforce mobile toggle result
        if: always()
        run: test "${{ steps.mobile_toggle.outcome }}" = success
      - name: Enforce mobile topbar result
        if: always()
        run: test "${{ steps.mobile_topbar.outcome }}" = success
      - name: Enforce mobile Home entry result
        if: always()
        run: test "${{ steps.mobile_home_entry.outcome }}" = success
      - name: Enforce mobile return Home result
        if: always()
        run: test "${{ steps.mobile_return_home.outcome }}" = success
      - name: Run Monodoo HOOT tests
        if: always()
        run: timeout 90s pytest tests/e2e/test_hoot.py -vv -s --maxfail=1
      - if: always()
        run: cd tests/runtime && docker compose logs --no-color
      - if: always()
        run: cd tests/runtime && docker compose down -v --remove-orphans
